services:
  maven:
    image: maven:3.9-eclipse-temurin-25
    user: "$DEFAULT_DOCKER_USER"
    working_dir: /usr/src/maven
    volumes:
      - ./backend:/usr/src/maven
      - ~/.m2:/var/maven/.m2
    environment:
      MAVEN_CONFIG: /var/maven/.m2
  node:
    image: node:26-alpine
    # Node ≥ 25 n'embarque plus corepack : pnpm (version du packageManager) est installé au
    # démarrage, à la place de l'image opendigitaleducation/node:*-pnpm.
    entrypoint:
      [
        "sh",
        "-c",
        'npm i -g --prefix /tmp/pnpm "$$(node -p "require(''./package.json'').packageManager.split(''+'')[0]")" >/dev/null && PATH=/tmp/pnpm/bin:$$PATH exec "$$@"',
        "--",
      ]
    working_dir: /home/node/app
    environment:
      - NPM_TOKEN
      - CHROMATIC_TOKEN
      - NODE_AUTH_TOKEN
    volumes:
      - ./:/home/node/app
      - ~/.pnpm:/.pnpm
  plantuml:
    image: plantuml/plantuml
    working_dir: /workspace
    volumes:
      - ./:/workspace
